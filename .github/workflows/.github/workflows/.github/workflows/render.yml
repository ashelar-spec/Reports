name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Save HTML Payload
        run: |
          echo '${{ github.event.client_payload.html }}' > table.html

      - name: Take Screenshot
        run: node render.js

      - name: Upload Image to GitHub Release Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          files: output.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Image to Google Chat Webhook
        run: |
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/latest/output.png?v=$(date +%s)"
          curl -X POST -H 'Content-Type: application/json' \
          -d '{
            "cardsV2": [{
              "cardId": "cashFlowColoredTableCard",
              "card": {
                "header": {
                  "title": "Cash Flow Report",
                  "subtitle": "Live Fund Range (Z1:AE16)"
                },
                "sections": [{
                  "widgets": [{
                    "image": {
                      "imageUrl": "'"$IMAGE_URL"'",
                      "altText": "Exact Cash Flow Table Image"
                    }
                  }]
                }]
              }
            }]
          }' "${{ github.event.client_payload.webhook_url }}"
