name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Puppeteer Directly
        run: npm install puppeteer

      - name: Build HTML & Rendering Script
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 -d > table.html
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          (async () => {
            const htmlContent = fs.readFileSync('table.html', 'utf8');
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            await page.setViewport({ width: 1400, height: 900, deviceScaleFactor: 2 });
            await page.setContent(htmlContent, { waitUntil: 'networkidle0' });
            const element = await page.$('table');
            await element.screenshot({ path: 'output.png' });
            await browser.close();
          })();
          EOF

      - name: Execute Puppeteer Screenshot
        run: node render.js

      - name: Upload Image to GitHub Release Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Latest Table Render"
          files: output.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post Image to Google Chat Webhook
        run: |
          IMAGE_URL="https://github.com/${{ github.repository }}/releases/download/v1.0.0/output.png?v=$(date +%s)"
          curl -X POST -H 'Content-Type: application/json' \
          -d '{
            "cardsV2": [{
              "cardId": "cashFlowColoredTableCard",
              "card": {
                "header": {
                  "title": "Cash Flow Report",
                  "subtitle": "Live Fund Range (Z1:AE16)"
                },
                "sections": [{
                  "widgets": [{
                    "image": {
                      "imageUrl": "'"$IMAGE_URL"'",
                      "altText": "Exact Cash Flow Table Image"
                    }
                  }]
                }]
              }
            }]
          }' "${{ github.event.client_payload.webhook_url }}"
