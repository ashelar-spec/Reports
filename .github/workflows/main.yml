name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Save HTML File
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 -d > table.html

      - name: Take Screenshot with Puppeteer
        run: node render.js

      - name: Post Image to Google Chat Webhook
        run: |
          # Convert output image to Base64 data URL directly for inline rendering
          IMAGE_BASE64=$(base64 -w 0 output.png)
          IMAGE_URL="data:image/png;base64,${IMAGE_BASE64}"
          
          curl -X POST -H 'Content-Type: application/json' \
          -d '{
            "cardsV2": [{
              "cardId": "cashFlowColoredTableCard",
              "card": {
                "header": {
                  "title": "Cash Flow Report",
                  "subtitle": "Live Fund Range (Z1:AE16)"
                },
                "sections": [{
                  "widgets": [{
                    "image": {
                      "imageUrl": "'"$IMAGE_URL"'",
                      "altText": "Exact Cash Flow Table Image"
                    }
                  }]
                }]
              }
            }]
          }' "${{ github.event.client_payload.webhook_url }}"
