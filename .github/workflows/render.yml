name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Axios
        run: |
          npm install puppeteer axios

      - name: Decode Base64 HTML to File
        run: |
          mkdir -p images
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const fileName = "${{ github.event.client_payload.filename }}";
            const outputPath = path.join('images', fileName);

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image saved to " + outputPath);
          })();
          EOF
          node render.js

      - name: Commit Image to Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "Archive report: ${{ github.event.client_payload.filename }}" || echo "No changes to commit"
          git push

