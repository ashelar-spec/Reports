name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Axios
        run: |
          npm install puppeteer axios

      - name: Decode Base64 HTML to File
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const outputPath = path.resolve('output.png');

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image successfully rendered to output.png");
          })();
          EOF
          node render.js

      - name: Upload and Send Direct Image to Chat
        run: |
          cat << 'EOF' > send.js
          const axios = require('axios');
          const { execSync } = require('child_process');
          const path = require('path');

          (async () => {
            const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
            const timestamp = "${{ github.event.client_payload.timestamp }}";
            const imagePath = path.resolve('output.png');

            console.log("Uploading rendered image...");
            let directImageUrl = "";

            try {
              // Upload to catbox.moe for a direct .png image URL
              const res = execSync(`curl -s -F "reqtype=fileupload" -F "fileToUpload=@${imagePath}" https://catbox.moe/user/api.php`).toString().trim();
              if (res.startsWith("http")) {
                directImageUrl = res;
              }
            } catch (err) {
              console.log("Catbox upload failed, attempting fallback...");
            }

            if (!directImageUrl) {
              try {
                // Secondary direct fallback
                const res = execSync(`curl -s -F "file=@${imagePath}" https://0x0.st`).toString().trim();
                directImageUrl = res;
              } catch (err) {
                console.error("All upload channels failed.");
                process.exit(1);
              }
            }

            console.log("Image URL obtained: " + directImageUrl);

            // Using standard cards schema to guarantee inline thumbnail rendering
            const chatPayload = {
              cards: [
                {
                  header: {
                    title: "📊 Daily Store Fund Report",
                    subtitle: timestamp
                  },
                  sections: [
                    {
                      widgets: [
                        {
                          image: {
                            imageUrl: directImageUrl,
                            onClick: {
                              openLink: {
                                url: directImageUrl
                              }
                            }
                          }
                        },
                        {
                          buttons: [
                            {
                              textButton: {
                                text: "🔍 OPEN FULL SCREENSHOT",
                                onClick: {
                                  openLink: {
                                    url: directImageUrl
                                  }
                                }
                              }
                            }
                          ]
                        }
                      ]
                    }
                  ]
                }
              ]
            };

            const response = await axios.post(webhookUrl, chatPayload);
            console.log("Google Chat Post Response:", response.status);
          })();
          EOF
          node send.js
