name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Dependencies
        run: |
          npm install puppeteer axios form-data

      - name: Decode Base64 HTML to File
        run: |
          mkdir -p images
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const fileName = "${{ github.event.client_payload.filename }}";
            const outputPath = path.join('images', fileName);

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image saved to " + outputPath);
          })();
          EOF
          node render.js

      - name: Commit Image to Archive (Preserves Past Images)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "Archive report: ${{ github.event.client_payload.filename }}" || echo "No changes to commit"
          git push

      - name: Post Image URL to Google Chat
        run: |
          cat << 'EOF' > send_chat.js
          const axios = require('axios');

          (async () => {
            const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
            const repo = process.env.GITHUB_REPOSITORY;
            const branch = "main"; // Change to "master" if your default branch is master
            const fileName = "${{ github.event.client_payload.filename }}";
            const rawImageUrl = `https://raw.githubusercontent.com/${repo}/${branch}/images/${fileName}`;

            const payload = {
              cardsV2: [
                {
                  cardId: "reportCard",
                  card: {
                    header: {
                      title: "Daily Report Table",
                      subtitle: "${{ github.event.client_payload.timestamp }}"
                    },
                    sections: [
                      {
                        widgets: [
                          {
                            image: {
                              imageUrl: rawImageUrl,
                              altText: "Daily Report Table"
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            };

            try {
              const res = await axios.post(webhookUrl, payload);
              console.log("Message sent to Google Chat: " + res.status);
            } catch (err) {
              console.error("Error sending to Google Chat:", err.response ? err.response.data : err.message);
              process.exit(1);
            }
          })();
          EOF
          node send_chat.js
