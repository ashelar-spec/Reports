name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Axios
        run: |
          npm install puppeteer axios

      - name: Decode Base64 HTML to File
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const outputPath = path.resolve('output.png');

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image rendered successfully to output.png");
          })();
          EOF
          node render.js

      - name: Upload Image and Post Directly to Google Chat
        run: |
          cat << 'EOF' > post_chat.js
          const axios = require('axios');
          const { execSync } = require('child_process');
          const path = require('path');

          (async () => {
            const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
            const timestamp = "${{ github.event.client_payload.timestamp }}";
            const imagePath = path.resolve('output.png');

            console.log("Uploading rendered image to public CDN...");
            // Upload to 0x0.st (fast, permanent-link hosting for raw image rendering in Chat)
            let imageUrl = "";
            try {
              imageUrl = execSync(`curl -s -F "file=@${imagePath}" https://0x0.st`).toString().trim();
            } catch (e) {
              console.log("Fallback to tmpfiles CDN...");
              const res = execSync(`curl -s -F "file=@${imagePath}" https://tmpfiles.org/api/v1/upload`).toString();
              const json = JSON.parse(res);
              imageUrl = json.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
            }

            console.log("Image URL obtained:", imageUrl);

            const cardPayload = {
              cardsV2: [
                {
                  cardId: "dailyFundReportCard",
                  card: {
                    header: {
                      title: "📊 Daily Store Fund Report",
                      subtitle: timestamp
                    },
                    sections: [
                      {
                        widgets: [
                          {
                            image: {
                              imageUrl: imageUrl,
                              altText: "Daily Store Fund Table Snapshot",
                              onClick: {
                                openLink: {
                                  url: imageUrl
                                }
                              }
                            }
                          },
                          {
                            buttonList: {
                              buttons: [
                                {
                                  text: "🔍 View Full Image",
                                  onClick: {
                                    openLink: {
                                      url: imageUrl
                                    }
                                  }
                                }
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            };

            console.log("Posting card to Google Chat...");
            const response = await axios.post(webhookUrl, cardPayload);
            console.log("Google Chat Response Status:", response.status);
          })();
          EOF
          node post_chat.js
