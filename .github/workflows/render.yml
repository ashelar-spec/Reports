name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Decode HTML file
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: echo "$HTML_BASE64" | base64 -d > .github/workflows/render.html

      - name: Render Table Image
        run: node .github/workflows/render.js

      - name: Commit and Push Image
        env:
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          mkdir -p Json
          mv output_v2.png "Json/${FILENAME}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Json/${FILENAME}"
          git commit -m "Add report image ${FILENAME}"
          git push

      - name: Send Image Only to Google Chat
        env:
          WEBHOOK_URL: ${{ github.event.client_payload.webhook_url }}
          FILENAME: ${{ github.event.client_payload.filename }}
        run: |
          IMAGE_URL="https://raw.githubusercontent.com/ashelar-spec/Reports/main/Json/${FILENAME}"

          curl -f -s -S -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"cardsV2\": [
                {
                  \"cardId\": \"table-only\",
                  \"card\": {
                    \"sections\": [
                      {
                        \"widgets\": [
                          {
                            \"image\": {
                              \"imageUrl\": \"${IMAGE_URL}\"
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            }"
