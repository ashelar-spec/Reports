name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Decode HTML & Take Screenshot
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 -d > table.html
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          (async () => {
            const htmlContent = fs.readFileSync('table.html', 'utf8');
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            
            // Standard compact viewport width to avoid horizontal stretching
            await page.setViewport({ width: 200, height: 400, deviceScaleFactor: 1 });
            
            await page.setContent(\`
              <!DOCTYPE html>
              <html>
                <head>
                  <style>
                    html, body {
                      margin: 0;
                      padding: 0;
                      background: transparent;
                      display: inline-block;
                    }
                    table {
                      border-collapse: collapse !important;
                      width: auto !important;
                      max-width: fit-content !important;
                    }
                  </style>
                </head>
                <body>
                  \${htmlContent}
                </body>
              </html>
            \`, { waitUntil: 'networkidle0' });

            const element = await page.\$('table');
            
            if (element) {
              await element.screenshot({ 
                path: 'output.png', 
                omitBackground: true 
              });
            } else {
              console.error('Table element not found!');
            }

            await browser.close();
          })();
          "
