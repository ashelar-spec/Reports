name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer
        run: |
          npm install puppeteer

      - name: Decode Base64 HTML to File
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const outputPath = path.resolve('output.png');

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image rendered temporarily to disk.");
          })();
          EOF
          node render.js

      - name: Send Base64 Image to Apps Script / Google Drive
        run: |
          cat << 'EOF' > send_to_drive.js
          const fs = require('fs');
          const { execSync } = require('child_process');
          const path = require('path');

          const callbackUrl = "${{ github.event.client_payload.callback_url }}";
          const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
          const timestamp = "${{ github.event.client_payload.timestamp }}";
          const imagePath = path.resolve('output.png');

          console.log("Checking callback URL...");
          if (!callbackUrl || !callbackUrl.includes("/exec")) {
            console.error("ERROR: No valid Apps Script Web App URL received. Value: " + callbackUrl);
            process.exit(1);
          }

          console.log("Encoding rendered image to base64...");
          const imageBase64 = fs.readFileSync(imagePath).toString('base64');
          const payload = JSON.stringify({
            image_base64: imageBase64,
            webhook_url: webhookUrl,
            timestamp: timestamp
          });

          fs.writeFileSync('payload.json', payload);

          console.log("Posting payload to Google Apps Script Web App endpoint...");
          try {
            // Using curl with -L ensures Google's 302 redirects are followed automatically
            const rawOutput = execSync(`curl -sS -L -X POST -H "Content-Type: application/json" -d @payload.json "${callbackUrl}"`, { maxBuffer: 50 * 1024 * 1024 }).toString();
            console.log("--- APPS SCRIPT RESPONSE ---");
            console.log(rawOutput);
            console.log("----------------------------");

            if (rawOutput.includes('"status":"error"') || rawOutput.includes('Google Accounts')) {
              console.error("Apps Script rejected or failed to process the request.");
              process.exit(1);
            }
          } catch (err) {
            console.error("Execution error:", err.message);
            process.exit(1);
          }
          EOF
          node send_to_drive.js
