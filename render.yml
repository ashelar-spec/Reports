name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Decode HTML & Take Screenshot
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 -d > table.html
          node -e "
          const puppeteer = require('puppeteer');
          const fs = require('fs');
          (async () => {
            const htmlContent = fs.readFileSync('table.html', 'utf8');
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            
            // Set standard base viewport
            await page.setViewport({ width: 1200, height: 800, deviceScaleFactor: 1 });
            
            // Inject scaling styles to shrink font and cell sizes overall
            await page.setContent(\`
              <style>
                html, body { 
                  margin: 0; 
                  padding: 0; 
                  display: inline-block; 
                  background: transparent; 
                }
                table { 
                  transform: scale(0.6) !important; 
                  transform-origin: 0 0 !important; 
                  border-collapse: collapse; 
                }
              </style>
              \${htmlContent}
            \`, { waitUntil: 'networkidle0' });

            const element = await page.\$('table');
            
            if (element) {
              await element.screenshot({ path: 'output.png', omitBackground: true });
            } else {
              console.error('Table element not found!');
            }

            await browser.close();
          })();
          "
