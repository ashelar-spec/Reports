name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Decode HTML & Take Screenshot
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 -d > table.html
          node -e "
            const puppeteer = require('puppeteer');
            const fs = require('fs');
            (async () => {
              const htmlContent = fs.readFileSync('table.html', 'utf8');
              const browser = await puppeteer.launch({
                args: ['--no-sandbox', '--disable-setuid-sandbox']
              });
              const page = await browser.newPage();
await page.setContent(htmlContent, { waitUntil: 'networkidle0' });

// 1. Target the table element
const element = await page.$('table');

// 2. Take a tightly fitted screenshot directly of the table element
await element.screenshot({ 
  path: 'output.JPEG',
  omitBackground: true // removes extra empty background area
});
          "
         - name: Compress JPEG
        run: |
          sudo apt-get update
          sudo apt-get install -y optipng
          optipng -o2 output.png
     
       - name: Publish Image to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: .
          publish_branch: gh-pages
          keep_files: false

      - name: Post Native Image to Google Chat
        run: |
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          IMAGE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/output.jpeg?v=$(date +%s)"
          
          curl -X POST -H "Content-Type: application/json; charset=UTF-8" \
          -d "{\"text\": \"${IMAGE_URL}\"}" \
          "${{ github.event.client_payload.webhook_url }}"
