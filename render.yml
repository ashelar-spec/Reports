name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install puppeteer axios form-data

      - name: Decode Base64 HTML to File
        run: |
          mkdir -p images
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const fileName = "${{ github.event.client_payload.filename }}";
            const outputPath = path.join('images', fileName);

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image saved to: " + outputPath);
          })();
          EOF
          node render.js

      - name: Commit Image to Git Archive (Preserves Past Days)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "Archive report: ${{ github.event.client_payload.filename }}" || echo "No changes to commit"
          git push

      - name: Upload Image & Send Clickable Card to Google Chat
        run: |
          cat << 'EOF' > send_chat.js
          const axios = require('axios');
          const fs = require('fs');
          const path = require('path');
          const FormData = require('form-data');

          (async () => {
            const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
            const fileName = "${{ github.event.client_payload.filename }}";
            const imagePath = path.join('images', fileName);
            const timestamp = "${{ github.event.client_payload.timestamp }}";

            // Upload to 0x0.st / litterbox to get a public HTTPS link accessible by Google Chat
            const form = new FormData();
            form.append('file', fs.createReadStream(imagePath));

            console.log("Hosting image temporarily for Google Chat rendering...");
            let publicImageUrl = "";

            try {
              const uploadRes = await axios.post('https://0x0.st', form, {
                headers: form.getHeaders(),
                timeout: 30000
              });
              publicImageUrl = uploadRes.data.trim();
              console.log("Public image URL:", publicImageUrl);
            } catch (uploadErr) {
              console.error("Direct hosting failed, trying fallback...", uploadErr.message);
              // Fallback host
              const form2 = new FormData();
              form2.append('reqtype', 'fileupload');
              form2.append('time', '72h');
              form2.append('fileToUpload', fs.createReadStream(imagePath));
              const fallbackRes = await axios.post('https://litterbox.catbox.moe/resources/internals/api.php', form2, {
                headers: form2.getHeaders()
              });
              publicImageUrl = fallbackRes.data.trim();
              console.log("Fallback public image URL:", publicImageUrl);
            }

            // Construct Google Chat Card V2 with Clickable Zoom Action
            const cardPayload = {
              cardsV2: [
                {
                  cardId: "dailyReportCard",
                  card: {
                    header: {
                      title: "Daily Report Table",
                      subtitle: timestamp
                    },
                    sections: [
                      {
                        widgets: [
                          {
                            image: {
                              imageUrl: publicImageUrl,
                              altText: "Daily Report Table",
                              onClick: {
                                openLink: {
                                  url: publicImageUrl
                                }
                              }
                            }
                          },
                          {
                            buttonList: {
                              buttons: [
                                {
                                  text: "🔎 Open Full Size",
                                  onClick: {
                                    openLink: {
                                      url: publicImageUrl
                                    }
                                  }
                                }
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            };

            const chatRes = await axios.post(webhookUrl, cardPayload);
            console.log("Successfully sent to Google Chat! Status:", chatRes.status);
          })();
          EOF
          node send_chat.js
