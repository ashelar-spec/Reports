name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

permissions:
  contents: write

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Axios
        run: |
          npm install puppeteer axios

      - name: Decode Base64 HTML to File
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const outputPath = path.resolve('output.png');

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image rendered successfully to output.png");
          })();
          EOF
          node render.js

      - name: Commit Image to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp output.png reports/latest.png
          git add reports/latest.png
          git commit -m "Update table screenshot [skip ci]" || echo "No changes"
          git push

      - name: Send Direct Image to Google Chat
        run: |
          cat << 'EOF' > post_chat.js
          const axios = require('axios');

          (async () => {
            const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
            const timestamp = "${{ github.event.client_payload.timestamp }}";
            
            // Raw GitHub URL with cache buster query parameter so Google Chat refreshes the image
            const directImageUrl = `https://raw.githubusercontent.com/ashelar-spec/Reports/main/reports/latest.png?t=${Date.now()}`;
            console.log("Image URL:", directImageUrl);

            const chatPayload = {
              cardsV2: [
                {
                  cardId: "fundReportCard",
                  card: {
                    header: {
                      title: "📊 Daily Store Fund Report",
                      subtitle: timestamp
                    },
                    sections: [
                      {
                        widgets: [
                          {
                            image: {
                              imageUrl: directImageUrl,
                              altText: "Daily Store Fund Table Snapshot",
                              onClick: {
                                openLink: {
                                  url: directImageUrl
                                }
                              }
                            }
                          },
                          {
                            buttonList: {
                              buttons: [
                                {
                                  text: "🔍 Open Full Screenshot",
                                  onClick: {
                                    openLink: {
                                      url: directImageUrl
                                    }
                                  }
                                }
                              ]
                            }
                          }
                        ]
                      }
                    ]
                  }
                }
              ]
            };

            const response = await axios.post(webhookUrl, chatPayload);
            console.log("Chat Delivery Status:", response.status);
          })();
          EOF
          node post_chat.js
