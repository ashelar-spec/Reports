name: Render Table and Send to Google Chat

on:
  repository_dispatch:
    types: [render_table]

jobs:
  render_and_send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Puppeteer and Axios
        run: |
          npm install puppeteer axios

      - name: Decode Base64 HTML to File
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 --decode > input.html

      - name: Render HTML Table to Image
        run: |
          cat << 'EOF' > render.js
          const puppeteer = require('puppeteer');
          const path = require('path');

          (async () => {
            const browser = await puppeteer.launch({
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            const page = await browser.newPage();
            const filePath = `file://${path.resolve('input.html')}`;
            await page.goto(filePath, { waitUntil: 'networkidle0' });

            const table = await page.$('table');
            const outputPath = path.resolve('output.png');

            if (table) {
              await table.screenshot({ path: outputPath });
            } else {
              await page.screenshot({ path: outputPath, fullPage: true });
            }

            await browser.close();
            console.log("Image rendered temporarily to disk.");
          })();
          EOF
          node render.js

      - name: Send Base64 Image to Apps Script / Google Drive
        run: |
          cat << 'EOF' > callback.js
          const axios = require('axios');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const callbackUrl = "${{ github.event.client_payload.callback_url }}";
            const webhookUrl = "${{ github.event.client_payload.webhook_url }}";
            const timestamp = "${{ github.event.client_payload.timestamp }}";
            const imagePath = path.resolve('output.png');

            const imageBuffer = fs.readFileSync(imagePath);
            const imageBase64 = imageBuffer.toString('base64');

            if (!callbackUrl) {
              console.error("ERROR: No callback_url received from Google Apps Script.");
              process.exit(1);
            }

            console.log("Sending base64 image data to Google Apps Script Web App: " + callbackUrl);
            const response = await axios.post(callbackUrl, {
              image_base64: imageBase64,
              webhook_url: webhookUrl,
              timestamp: timestamp
            }, {
              maxContentLength: Infinity,
              maxBodyLength: Infinity
            });

            console.log("Apps Script Response:", response.data);
          })();
          EOF
          node callback.js
