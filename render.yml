name: Render Sheet Table Image

on:
  repository_dispatch:
    types: [render_table]
  workflow_dispatch: # Allows manual trigger from Actions tab

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      - name: Run Render Script
        run: node render.js

      - name: Commit and Push Updated Image
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add output.png
          git commit -m "Update rendered table image" || exit 0
          git push
